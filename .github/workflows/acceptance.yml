name: Snipe-IT REST runtime acceptance
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snipe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash tests/acceptance/run.sh
      - if: always()
        run: docker compose -f tests/acceptance/compose.yml logs --no-color > acceptance.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snipe-runtime-logs
          path: acceptance.log
